<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная навигация для iframe</title>
    <style>
        /* Обнуляем отступы, чтобы занять 100% экрана */
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Основной iframe на весь экран */
        .target-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Общий контейнер для абсолютного позиционирования элементов управления */
        .nav-controls {
            position: absolute;
            bottom: 30px; /* Прижимаем к низу для удобства пальцев */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 9999; /* Поверх фрейма */
            pointer-events: none; /* Чтобы контейнер не мешал кликам по фрейму */
        }

        /* Стили для кнопок-стрелок */
        .arrow-btn {
			pointer-events: auto;
			width: 60px;
			height: 60px;
			border-radius: 50%;
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
			border: 2px solid rgba(255, 255, 255, 0.4);
			
			/* Эти три строчки центрируют стрелку внутри круга */
			display: flex;
			justify-content: center;
			align-items: center;
			
			/* Сброс высоты строки и шрифты */
			font-size: 28px;
			line-height: 1;
			font-family: sans-serif;
			
			/* Небольшой отступ снизу для идеального оптического выравнивания */
			padding-bottom: 4px; 
			
			cursor: pointer;
			box-shadow: 0 4px 10px rgba(0,0,0,0.3);
			user-select: none;
			transition: background 0.2s, transform 0.1s;
			-webkit-tap-highlight-color: transparent;        
		}

        /* Эффект при нажатии на смартфоне */
        .arrow-btn:active {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(0.92);
            border-color: #fff;
        }

        /* Информатор страниц (тоже полупрозрачный) */
        .counter-badge {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Целевой фрейм, который растянут на всю доступную область -->
    <iframe id="targetFrame" name="targetFrame" class="target-frame" src=""></iframe>

    <!-- Абсолютно позиционированные элементы управления -->
    <div class="nav-controls">
        <div class="arrow-btn" id="prevBtn" role="button">←</div>
        <div class="counter-badge" id="pageCounter"></div>
        <div class="arrow-btn" id="nextBtn" role="button">→</div>
    </div>

    <script>
        // Массив с адресами
        const urls = [
            "./CAM_20260521145439_0026_D_1787754272409.html",
            "./CAM_20260522093609_0029_D_1787755025661.html",
            "./CAM_20260522094704_0030_D_1787755447417.html",
            "./CAM_20260522111215_0034_D_1787755881570.html",
            "./CAM_20260522112109_0035_D_1787756211133.html",
            "./CAM_20260522122843_0039_D_1787756626151.html",
            "./CAM_20260522130427_0042_D_1787756810834.html",
            "./CAM_20260522131857_0043_D_1787917168423.html",
            "./CAM_20260522150451_0048_D_1787757654951.html",
            "./CAM_20260522164725_0052_D_1787758237984.html",
            "./CAM_20260522170247_0053_D_1787758445116.html",
            "./CAM_20260522172739_0055_D_1787758675533.html",		];

        let currentIndex = 0;

        // Элементы
        const iframe = document.getElementById('targetFrame');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageCounter = document.getElementById('pageCounter');

        // Функция обновления
        function updateNavigation() {
            // Меняем URL в целевом iframe
            iframe.src = urls[currentIndex];
            // Обновляем мобильный счетчик
            pageCounter.innerHTML = `${currentIndex + 1}&nbsp;/&nbsp;${urls.length}`;
        }

        // Клик назад (с зацикливанием)
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : urls.length - 1;
            updateNavigation();
        });

        // Клик вперед (с зацикливанием)
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex < urls.length - 1) ? currentIndex + 1 : 0;
            updateNavigation();
        });

        // Первая инициализация
        updateNavigation();
    </script>

</body>
</html>
